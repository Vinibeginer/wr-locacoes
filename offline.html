<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WR Locações — sem conexão</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#3E5563;color:#fff;font-family:system-ui,"Segoe UI",sans-serif;padding:16px}
  .c{max-width:420px;text-align:center}
  img{width:72px;height:72px;border-radius:14px}
  h1{font-size:22px;margin:18px 0 8px}
  p{opacity:.85;line-height:1.5;margin:0 0 20px}
  button{font:inherit;font-weight:600;background:#E87438;color:#1A1206;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
</style>
</head>
<body>
  <div class="c">
    <img src="icons/icon-192.png" alt="">
    <h1>Sem conexão com a internet</h1>
    <p>O WR Locações precisa de internet para acessar o banco de dados. Verifique a conexão e tente de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
